      const data = [];
      for (let h = 0; h < 24; h++) {
        const base1 = 520 + Math.sin(h / 24 * Math.PI * 2) * 120 + (Math.random() - 0.5) * 60;
        const base2 = 480 + Math.sin(h / 24 * Math.PI * 2 + 1) * 100 + (Math.random() - 0.5) * 50;
        const base3 = 440 + Math.sin(h / 24 * Math.PI * 2 + 2) * 90 + (Math.random() - 0.5) * 40;
        data.push({ hour: String(h).padStart(2, '0') + ':00', building1: Math.round(base1), building2: Math.round(base2), building3: Math.round(base3), total: Math.round(base1 + base2 + base3) });
      }
      return data;
    }

    // ==================== ECharts Wrappers ====================
    function ELineChart({ data, building, t }) {
      const chartRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!chartRef.current || !data || !t) return;
        
        if (!instanceRef.current) {
          instanceRef.current = echarts.init(chartRef.current);
        }
        const chart = instanceRef.current;

        const lines = building === 'all'
          ? [
              { key: 'building1', color: '#3B82F6', label: t('chart.building1') },
              { key: 'building2', color: '#F59E0B', label: t('chart.building2') },
              { key: 'building3', color: '#10B981', label: t('chart.building3') },
            ]
          : [{ key: 'building' + building.replace('b', ''), color: building === 'b1' ? '#3B82F6' : building === 'b2' ? '#F59E0B' : '#10B981', label: t('chart.building' + building.replace('b', '')) }];

        const timeKey = data.length > 0 && data[0].date !== undefined ? 'date' : 'hour';
        const option = {
          tooltip: { trigger: 'axis', backgroundColor: '#fff', borderColor: '#E5E7EB', borderWidth: 1, textStyle: { fontSize: 12, color: '#374151' } },
          legend: { bottom: 0, textStyle: { fontSize: 11, color: '#6B7280' }, itemWidth: 16, itemHeight: 2 },

            lineStyle: { width: 2, color: l.color }, itemStyle: { color: l.color },
            areaStyle: lines.length === 1 ? { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: l.color + '20' }, { offset: 1, color: l.color + '00' }] } } : undefined,

        };

          window.removeEventListener('resize', onResize);

            instanceRef.current.dispose();
            instanceRef.current = null;
          }
        };
      }, [data, building, t]);

      return React.createElement('div', { ref: chartRef, style: { width: '100%', height: '220px' } });
    }

    function Toast({ message, visible, onClose }) {
      useEffect(() => { if (visible) { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); } }, [visible, onClose]);

      return html`<div class="fixed top-6 right-6 z-[9999] toast-enter"><div class="bg-white border border-success rounded-lg shadow-lg px-5 py-3 flex items-center gap-3"><svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-sm font-medium text-gray-800">${message}</span></div></div>`;

    }

    function Modal({ open, onClose, title, children, width = 'max-w-4xl' }) {
      if (!open) return null;
      return html`<div class="fixed inset-0 z-[9990] flex items-center justify-center bg-black/40 fade-in" onClick=${onClose}><div class="bg-white rounded-2xl shadow-2xl border border-border ${width} w-full max-h-[85vh] flex flex-col fade-in mx-4" onClick=${e => e.stopPropagation()}><div class="flex items-center justify-between px-6 py-4 border-b border-border"><h2 class="text-lg font-semibold text-gray-900">${title}</h2><button onClick=${onClose} class="p-1.5 rounded-lg hover:bg-gray-100 transition"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><div class="flex-1 overflow-auto p-6 scrollbar-thin">${children}</div></div></div>`;

      return html`<div class="bg-white rounded-xl border border-border shadow-sm ${className}"><div class="flex items-center justify-between px-5 py-3.5 border-b border-border"><h3 class="text-sm font-semibold text-gray-900">${title}</h3>${extra && html`<div class="flex items-center gap-2">${extra}</div>`}</div><div class="p-5">${children}</div></div>`;
    }

    function Btn({ children, onClick, variant = 'default', size = 'sm', icon, disabled }) {
      const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50';
      const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm' };
      const variants = { default: 'bg-gray-50 text-gray-700 border border-border hover:bg-gray-100', primary: 'bg-primary text-white hover:bg-primary-dark', ghost: 'text-gray-600 hover:bg-gray-100' };
      return html`<button class="${base} ${sizes[size]} ${variants[variant]}" onClick=${onClick} disabled=${disabled}>${icon}${children}</button>`;
    }

    // ==================== History Modal ====================
    function HistoryModal({ open, onClose, defaultBuilding }) {
      const { t } = useI18n();
      const [tab, setTab] = useState('history');
      const [sortKey, setSortKey] = useState('date');
      const [sortDir, setSortDir] = useState('desc');
      const [page, setPage] = useState(1);
      const [selectedBuildings, setSelectedBuildings] = useState([]);
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const [startDate, setStartDate] = useState('2026-11-01');
      const [endDate, setEndDate] = useState('2026-11-10');
      const dropdownRef = useRef(null);
      const pageSize = 8;

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setDropdownOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => {
        if (open && defaultBuilding) {
          if (defaultBuilding === 'all') {
            setSelectedBuildings(['1号楼', '2号楼', '3号楼']);
          } else {
            const buildingMap = { 'b1': '1号楼', 'b2': '2号楼', 'b3': '3号楼' };
            setSelectedBuildings([buildingMap[defaultBuilding] || '1号楼']);
          }
        }
      }, [open, defaultBuilding]);

      const filteredData = useMemo(() => {
        let data = mockHistoryTable;
        if (selectedBuildings.length > 0) {
          data = data.filter(row => selectedBuildings.includes(row.building));
        }
        if (startDate && endDate) {
          data = data.filter(row => row.date >= startDate && row.date <= endDate);
        }
        return data;
      }, [selectedBuildings, startDate, endDate]);

      const chartData = useMemo(() => {
        const byDate = {};
        filteredData.forEach(row => {
          if (!byDate[row.date]) {
            byDate[row.date] = { date: row.date, building1: 0, building2: 0, building3: 0 };
          }
          const key = row.building === '1号楼' ? 'building1' : row.building === '2号楼' ? 'building2' : 'building3';
          byDate[row.date][key] += row.emission;
        });
        return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
      }, [filteredData]);

      const sorted = useMemo(() => {
        return [...filteredData].sort((a, b) => {
          const va = a[sortKey], vb = b[sortKey];
          if (va < vb) return sortDir === 'asc' ? -1 : 1;
          if (va > vb) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }, [sortKey, sortDir, filteredData]);

      const paged = sorted.slice((page - 1) * pageSize, page * pageSize);
      const totalPages = Math.ceil(sorted.length / pageSize);

      const handleSort = (key) => { if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortKey(key); setSortDir('asc'); } };
      
      const toggleBuilding = (building) => {
        setSelectedBuildings(prev => 
          prev.includes(building) 
            ? prev.filter(b => b !== building)
            : [...prev, building]
        );
        setPage(1);
      };

      const SortIcon = ({ col }) => {
        if (sortKey !== col) return html`<span class="text-gray-300 ml-1">↕</span>`;
        return html`<span class="text-primary ml-1">${sortDir === 'asc' ? '↑' : '↓'}</span>`;
      };

      return html`
        <${Modal} open=${open} onClose=${onClose} title=${t('history.title')} width="max-w-5xl">
          <div class="flex gap-1 mb-4 border-b border-border">
            <button onClick=${() => setTab('history')} class="px-4 py-2 text-sm font-medium border-b-2 transition ${tab === 'history' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}">${t('history.historyTab')}</button>
            <button onClick=${() => setTab('export')} class="px-4 py-2 text-sm font-medium border-b-2 transition ${tab === 'export' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}">${t('history.exportTab')}</button>
          </div>
          ${tab === 'history' ? html`
            <div class="flex gap-3 mb-4 flex-wrap items-center">
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500">${t('history.dateRange')}:</span>
                <input type="date" value=${startDate} onChange=${e => { setStartDate(e.target.value); setPage(1); }} class="px-2 py-1 text-xs border border-border rounded-md"/>
                <span class="text-xs text-gray-400">${t('common.to')}</span>
                <input type="date" value=${endDate} onChange=${e => { setEndDate(e.target.value); setPage(1); }} class="px-2 py-1 text-xs border border-border rounded-md"/>
              </div>
              <div class="flex items-center gap-2 relative" ref=${dropdownRef}>
                <span class="text-xs text-gray-500">${t('history.building')}:</span>
                <button onClick=${() => setDropdownOpen(!dropdownOpen)} class="px-3 py-1.5 text-xs border border-border rounded-md bg-white flex items-center gap-1.5 hover:border-primary transition min-w-[120px] justify-between">
                  <span class="truncate">${selectedBuildings.length === 3 ? t('common.all') : selectedBuildings.join(', ')}</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="shrink-0 ${dropdownOpen ? 'rotate-180' : ''} transition-transform"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                ${dropdownOpen ? html`
                  <div class="absolute left-0 top-full mt-1 bg-white border border-border rounded-lg shadow-lg z-50 min-w-[160px] py-1">
                    <button onClick=${() => { setSelectedBuildings(['1号楼', '2号楼', '3号楼']); setPage(1); }} class="w-full px-3 py-2 text-xs flex items-center gap-2 hover:bg-gray-50 transition">
                      <span class="w-4 h-4 rounded border flex items-center justify-center ${selectedBuildings.length === 3 ? 'bg-primary border-primary' : 'border-gray-300'}">
                        ${selectedBuildings.length === 3 ? html`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
                      </span>
                      <span class="${selectedBuildings.length === 3 ? 'text-primary font-medium' : 'text-gray-700'}">${t('common.all')}</span>
                    </button>
                    <div class="border-t border-gray-100 my-1"></div>
                    ${['1号楼', '2号楼', '3号楼'].map(b => html`
                      <button key=${b} onClick=${() => {
                        let next;
                        if (selectedBuildings.includes(b)) {
                          next = selectedBuildings.filter(x => x !== b);
                          if (next.length === 0) next = ['1号楼', '2号楼', '3号楼'];
                        } else {
                          next = [...selectedBuildings.filter(x => !['1号楼', '2号楼', '3号楼'].includes(x) || x !== b), b];
                          if (next.length > 3) next = [b];
                        }
                        setSelectedBuildings(next);
                        setPage(1);
                      }} class="w-full px-3 py-2 text-xs flex items-center gap-2 hover:bg-gray-50 transition">
                        <span class="w-4 h-4 rounded border flex items-center justify-center ${selectedBuildings.includes(b) ? 'bg-primary border-primary' : 'border-gray-300'}">
                          ${selectedBuildings.includes(b) ? html`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
                        </span>
                        <span class="${selectedBuildings.includes(b) ? 'text-primary font-medium' : 'text-gray-700'}">${b}</span>
                      </button>
                    `)}
                  </div>
                ` : ''}
              </div>
            </div>
            <div class="mb-4 bg-gray-50 rounded-lg p-3">
              <${ELineChart} data=${chartData} building=${selectedBuildings.length === 3 ? 'all' : selectedBuildings.length === 1 ? (selectedBuildings[0] === '1号楼' ? 'b1' : selectedBuildings[0] === '2号楼' ? 'b2' : 'b3') : 'all'} t=${t} />
            </div>
            <div class="overflow-auto rounded-lg border border-border">
              <table class="w-full text-sm">
                <thead class="bg-gray-50"><tr>${[{ key: 'date', label: t('history.date') }, { key: 'building', label: t('history.building') }, { key: 'device', label: t('history.device') }, { key: 'power', label: t('history.power') }, { key: 'factor', label: t('history.factor') }, { key: 'emission', label: t('history.emission') }].map(col => html`<th key=${col.key} onClick=${() => handleSort(col.key)} class="px-4 py-2.5 text-left text-xs font-medium text-gray-500 cursor-pointer hover:bg-gray-100 select-none whitespace-nowrap">${col.label}<${SortIcon} col=${col.key} /></th>`)}</tr></thead>
                <tbody class="divide-y divide-border">${paged.length > 0 ? paged.map((row, i) => html`<tr key=${i} class="hover:bg-blue-50/40 transition"><td class="px-4 py-2 text-xs text-gray-700">${row.date}</td><td class="px-4 py-2 text-xs text-gray-700">${row.building}</td><td class="px-4 py-2 text-xs font-mono-num text-gray-700">${row.device}</td><td class="px-4 py-2 text-xs font-mono-num text-gray-700">${row.power.toLocaleString()}</td><td class="px-4 py-2 text-xs font-mono-num text-gray-500">${row.factor}</td><td class="px-4 py-2 text-xs font-mono-num font-medium text-gray-900">${row.emission.toLocaleString()}</td></tr>`) : html`<tr><td colSpan="6" class="px-4 py-8 text-center text-xs text-gray-400">${t('common.empty')}</td></tr>`}</tbody>
              </table>
            </div>
            <div class="flex items-center justify-between mt-3"><span class="text-xs text-gray-500">${sorted.length} ${t('common.to')} ${totalPages}</span><div class="flex gap-1">${Array.from({ length: totalPages }, (_, i) => html`<button key=${i} onClick=${() => setPage(i + 1)} class="w-7 h-7 text-xs rounded-md transition ${page === i + 1 ? 'bg-primary text-white' : 'bg-gray-50 text-gray-600 hover:bg-gray-100 border border-border'}">${i + 1}</button>`)}</div></div>
          ` : html`
            <div class="overflow-auto rounded-lg border border-border">
              <table class="w-full text-sm">
                <thead class="bg-gray-50"><tr><th class="px-4 py-2.5 text-left text-xs font-medium text-gray-500">${t('history.exporter')}</th><th class="px-4 py-2.5 text-left text-xs font-medium text-gray-500">${t('history.exportTime')}</th><th class="px-4 py-2.5 text-left text-xs font-medium text-gray-500">${t('history.exportScope')}</th><th class="px-4 py-2.5 text-left text-xs font-medium text-gray-500">${t('history.action')}</th></tr></thead>
                <tbody class="divide-y divide-border">${mockExportRecords.map((r, i) => html`<tr key=${i} class="hover:bg-blue-50/40 transition"><td class="px-4 py-2 text-xs text-gray-700">${r.exporter}</td><td class="px-4 py-2 text-xs text-gray-500">${r.time}</td><td class="px-4 py-2 text-xs text-gray-700">${r.scope}</td><td class="px-4 py-2"><span class="px-2 py-0.5 text-xs font-medium bg-primary/10 text-primary rounded">${r.action}</span></td></tr>`)}</tbody>
              </table>
            </div>
          `}
        <//>
      `;
    }

            <${Btn} variant="primary" onClick=${() => {}}>${t('sidebar.calculate')}<//>

                <div class="bg-white rounded-lg p-4 border border-border"><div class="text-xs text-gray-500 mb-1">${t('cue.greenCredit')}</div><div class="text-xl font-bold font-mono-num text-success">${previewData.greenCredit.toLocaleString()} <span class="text-xs font-normal text-gray-500">kg CO₂e</span></div></div>

                <div class="bg-white rounded-lg p-4 border border-border"><div class="text-xs text-gray-500 mb-1">CUE</div><div class="text-xl font-bold font-mono-num text-primary">${previewData.cue} <span class="text-xs font-normal text-gray-500">kg CO₂e/kWh</span></div><div class="text-[10px] text-gray-400 mt-1 font-mono-num">${previewData.total.toLocaleString()} ÷ ${previewData.itEnergy.toLocaleString()}</div></div>

    // ==================== BIM Model (Three.js) ====================
    function BIMModel({ onSelectDevice, selectedDevice }) {
      const { t } = useI18n();
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const meshMapRef = useRef({});
      const [view, setView] = useState('perspective');
      const [layers, setLayers] = useState({ cabinets: true, devices: true, heatmap: true });
      const [hoveredDevice, setHoveredDevice] = useState(null);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
      const animFrameRef = useRef(null);
      const isDraggingRef = useRef(false);
      const prevMouseRef = useRef({ x: 0, y: 0 });
      const rotationRef = useRef({ x: -0.5, y: 0.6 });
      const zoomRef = useRef(18);

      const getEmissionColor = (emission) => {
        const max = 1700, min = 250;
        const ratio = Math.min(1, Math.max(0, (emission - min) / (max - min)));
        if (ratio < 0.33) return '#10B981';
        if (ratio < 0.66) return '#F59E0B';
        return '#EF4444';
      };

      useEffect(() => {
        if (!containerRef.current) return;
        const container = containerRef.current;
        const w = container.clientWidth;
        const h = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc);
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(12, 14, 16);
        camera.lookAt(0, 0, 1);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(30, 24);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf0, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.position.z = 1;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(30, 30, 0xd1d5db, 0xe5e7eb);
        gridHelper.position.y = 0.01;
        gridHelper.position.z = 1;
        scene.add(gridHelper);

        const buildingDefs = [
          { label: 'B1', x: -7, z: -2, w: 5, d: 4, color: 0xdbeafe },
          { label: 'B2', x: 0, z: -2, w: 5, d: 4, color: 0xdbeafe },
          { label: 'B3', x: 7, z: -2, w: 5, d: 4, color: 0xdbeafe },
        ];

        buildingDefs.forEach(bd => {
          const geo = new THREE.BoxGeometry(bd.w, 3.5, bd.d);
          const mat = new THREE.MeshStandardMaterial({ color: bd.color, transparent: true, opacity: 0.35, roughness: 0.5 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(bd.x, 1.75, bd.z);
          mesh.castShadow = true;
          scene.add(mesh);

          const edges = new THREE.EdgesGeometry(geo);
          const lineMat = new THREE.LineBasicMaterial({ color: 0x93c5fd });
          const wireframe = new THREE.LineSegments(edges, lineMat);
          wireframe.position.copy(mesh.position);
          scene.add(wireframe);

          const canvas = document.createElement('canvas');
          canvas.width = 128; canvas.height = 48;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#2563EB';
          ctx.font = 'bold 28px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(bd.label, 64, 34);
          const tex = new THREE.CanvasTexture(canvas);
          const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
          const sprite = new THREE.Sprite(spriteMat);
          sprite.position.set(bd.x, 4.2, bd.z);
          sprite.scale.set(2, 0.75, 1);
          scene.add(sprite);
        });

        meshMapRef.current = {};
        mockBimDevices.forEach(dev => {
          const isServer = dev.type === 'server';
          const isCooling = dev.type === 'cooling';
          const isUps = dev.type === 'ups';
          const isNetwork = dev.type === 'network';

          let geo, h;
          if (isServer || dev.type === 'storage') { geo = new THREE.BoxGeometry(0.8, 1.6, 0.6); h = 0.8; }
          else if (isCooling) { geo = new THREE.CylinderGeometry(0.45, 0.45, 1.2, 16); h = 0.6; }
          else if (isUps) { geo = new THREE.BoxGeometry(0.9, 1.4, 0.7); h = 0.7; }
          else { geo = new THREE.BoxGeometry(0.6, 0.8, 0.4); h = 0.4; }

          const color = layers.heatmap ? getEmissionColor(dev.emission) : '#60A5FA';
          const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.4, metalness: 0.2 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(dev.x * 1.2, h, dev.z * 1.2);
          mesh.castShadow = true;
          mesh.userData = dev;
          scene.add(mesh);
          meshMapRef.current[dev.id] = mesh;
        });

        const animate = () => {
          animFrameRef.current = requestAnimationFrame(animate);
          const cam = cameraRef.current;
          const r = rotationRef.current;
          const z = zoomRef.current;
          cam.position.x = z * Math.sin(r.y) * Math.cos(r.x);
          cam.position.y = z * Math.abs(Math.sin(r.x)) + 4;
          cam.position.z = z * Math.cos(r.y) * Math.cos(r.x);
          cam.lookAt(0, 1, 1);
          renderer.render(scene, cam);
        };
        animate();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });

          raycaster.setFromCamera(mouse, cameraRef.current);
          const meshes = Object.values(meshMapRef.current);
          const intersects = raycaster.intersectObjects(meshes);
          if (intersects.length > 0) {
            setHoveredDevice(intersects[0].object.userData);
            container.style.cursor = 'pointer';
          } else {
            setHoveredDevice(null);
            container.style.cursor = isDraggingRef.current ? 'grabbing' : 'grab';
          }

          if (isDraggingRef.current) {
            const dx = e.clientX - prevMouseRef.current.x;
            const dy = e.clientY - prevMouseRef.current.y;
            rotationRef.current.y += dx * 0.005;
            rotationRef.current.x = Math.max(-1.2, Math.min(-0.1, rotationRef.current.x + dy * 0.005));
            prevMouseRef.current = { x: e.clientX, y: e.clientY };
          }
        };

        const onMouseDown = (e) => {
          isDraggingRef.current = true;
          prevMouseRef.current = { x: e.clientX, y: e.clientY };
        };

        const onMouseUp = () => { isDraggingRef.current = false; };

        const onClick = (e) => {
          const rect = container.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, cameraRef.current);
          const meshes = Object.values(meshMapRef.current);
          const intersects = raycaster.intersectObjects(meshes);
          if (intersects.length > 0) {
            onSelectDevice(intersects[0].object.userData);
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          zoomRef.current = Math.max(8, Math.min(35, zoomRef.current + e.deltaY * 0.01));
        };

        container.addEventListener('mousemove', onMouseMove);
        container.addEventListener('mousedown', onMouseDown);
        container.addEventListener('mouseup', onMouseUp);
        container.addEventListener('mouseleave', onMouseUp);
        container.addEventListener('click', onClick);
        container.addEventListener('wheel', onWheel, { passive: false });

        const onResize = () => {
          const w2 = container.clientWidth;
          const h2 = container.clientHeight;
          camera.aspect = w2 / h2;
          camera.updateProjectionMatrix();
          renderer.setSize(w2, h2);
        };
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(animFrameRef.current);
          container.removeEventListener('mousemove', onMouseMove);
          container.removeEventListener('mousedown', onMouseDown);
          container.removeEventListener('mouseup', onMouseUp);
          container.removeEventListener('mouseleave', onMouseUp);
          container.removeEventListener('click', onClick);
          container.removeEventListener('wheel', onWheel);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
          container.removeChild(renderer.domElement);
        };
      }, [layers.heatmap]);

      const setViewMode = (v) => {
        setView(v);
        if (v === 'top') { rotationRef.current = { x: -1.5, y: 0 }; zoomRef.current = 20; }
        else { rotationRef.current = { x: -0.5, y: 0.6 }; zoomRef.current = 18; }
      };

      const toggleLayer = (key) => setLayers(l => ({ ...l, [key]: !l[key] }));

      return html`
        <div class="bg-white rounded-xl border border-border shadow-sm flex flex-col h-full">
          <div class="flex items-center justify-between px-5 py-3 border-b border-border flex-wrap gap-2">
            <div><h3 class="text-sm font-semibold text-gray-900">${t('bim.title')}</h3><p class="text-xs text-gray-500">${t('bim.titleEn')}</p></div>
            <div class="flex items-center gap-2 flex-wrap">
              <select class="px-2 py-1 text-xs border border-border rounded-md bg-white"><option>${t('bim.building')}: ${t('common.all')}</option><option>${t('chart.building1')}</option><option>${t('chart.building2')}</option><option>${t('chart.building3')}</option></select>
              <select class="px-2 py-1 text-xs border border-border rounded-md bg-white"><option>${t('bim.allDevices')}</option><option>${t('bim.server')}</option><option>${t('bim.storage')}</option><option>${t('bim.network')}</option><option>${t('bim.cooling')}</option><option>${t('bim.ups')}</option></select>
              <div class="flex gap-1">${['topView', 'perspectiveView', 'reset'].map(v => html`<button key=${v} onClick=${() => setViewMode(v === 'reset' ? 'perspective' : v === 'topView' ? 'top' : 'perspective')} class="px-2 py-1 text-xs rounded-md transition ${view === (v === 'reset' ? 'perspective' : v === 'topView' ? 'top' : 'perspective') ? 'bg-primary text-white' : 'bg-gray-50 text-gray-600 border border-border hover:bg-gray-100'}">${t('bim.' + v)}</button>`)}</div>
            </div>
          </div>
          <div class="flex items-center gap-3 px-5 py-2 border-b border-border bg-gray-50/50">
            <span class="text-xs text-gray-500">${t('bim.layers')}:</span>
            ${['cabinets', 'devices', 'heatmap'].map(key => html`<label key=${key} class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked=${layers[key]} onChange=${() => toggleLayer(key)} class="w-3.5 h-3.5 rounded border-gray-300 text-primary focus:ring-primary/30"/><span class="text-xs text-gray-700">${t('bim.' + key)}</span></label>`)}
          </div>
          <div class="flex-1 relative min-h-[400px]">
            <div ref=${containerRef} class="absolute inset-0 bim-canvas"/>
            ${hoveredDevice && html`<div class="absolute pointer-events-none z-10 bg-white/95 backdrop-blur rounded-lg shadow-lg border border-border px-3 py-2 text-xs" style=${{ left: mousePos.x + 12, top: mousePos.y - 10 }}><div class="font-semibold text-gray-900">${hoveredDevice.name}</div><div class="text-gray-500">${t('bim.buildingLabel')}: ${hoveredDevice.building}</div><div class="text-gray-500">${t('bim.carbonEmission')}: <span class="font-mono-num font-medium" style=${{ color: getEmissionColor(hoveredDevice.emission) }}>${hoveredDevice.emission} kg CO₂e</span></div></div>`}
            <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur rounded-lg border border-border px-3 py-2">
              <div class="text-xs font-medium text-gray-700 mb-1.5">${t('bim.location')}</div>
              ${layers.heatmap ? html`<div class="flex items-center gap-2"><span class="text-[10px] text-gray-500">${t('bim.lowEmission')}</span><div class="w-24 h-2.5 rounded-full" style=${{ background: 'linear-gradient(to right, #10B981, #F59E0B, #EF4444)' }}/><span class="text-[10px] text-gray-500">${t('bim.highEmission')}</span></div>` : html`<div class="flex items-center gap-2"><div class="w-3 h-3 rounded bg-blue-400"/><span class="text-[10px] text-gray-500">Device</span></div>`}
            </div>
          </div>
        </div>
      `;
    }

    // ==================== Device Info Panel ====================
    function DeviceInfoPanel({ device }) {
      const { t } = useI18n();
      if (!device) {
        return html`<div class="bg-white rounded-xl border border-border shadow-sm p-5 mt-4"><div class="flex items-center gap-2 text-gray-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="text-xs">${t('bim.selectDevice')}</span></div></div>`;
      }
      return html`
        <div class="bg-white rounded-xl border border-border shadow-sm p-5 mt-4 fade-in">
          <h4 class="text-sm font-semibold text-gray-900 mb-3">${t('bim.deviceInfo')}</h4>
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-50 rounded-lg p-3"><div class="text-xs text-gray-500">${t('bim.deviceName')}</div><div class="text-sm font-medium text-gray-900 font-mono-num">${device.name}</div></div>
            <div class="bg-gray-50 rounded-lg p-3"><div class="text-xs text-gray-500">${t('bim.buildingLabel')}</div><div class="text-sm font-medium text-gray-900">${device.building}</div></div>
            <div class="bg-gray-50 rounded-lg p-3"><div class="text-xs text-gray-500">${t('bim.powerUsage')}</div><div class="text-sm font-mono-num font-medium text-gray-900">${device.power} kWh</div></div>
            <div class="bg-gray-50 rounded-lg p-3"><div class="text-xs text-gray-500">${t('bim.emissionFactor')}</div><div class="text-sm font-mono-num text-gray-700">${EMISSION_FACTOR} kg/kWh</div></div>
            <div class="col-span-2 bg-blue-50 rounded-lg p-3 border border-blue-100"><div class="text-xs text-gray-500">${t('bim.carbonEmission')}</div><div class="text-lg font-mono-num font-bold text-primary">${device.emission} kg CO₂e</div></div>
          </div>
        </div>
      `;
    }

    function App() {
      const { t } = useI18n();
      const [selectedDevice, setSelectedDevice] = useState(null);

    // ==================== Render ====================

  </script>
